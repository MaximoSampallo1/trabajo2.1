    <header>
      <section>
        <h1>MotorsportsLp</h1>
        <p></p>
    </section>
    </header>
    <main>
      <section id="contact" class="py-16">
        <div class="container mx-auto px-4">
            <h3 class="text-3xl font-bold mb-6">Contáctanos</h3>
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-lg">Nombre</label>
                    <input type="text" id="name" name="name" class="w-full text-white rounded-lg py-2 px-4">
                </div>
                <div>
                    <label for="email" class="block text-lg">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="w-full text-white rounded-lg py-2 px-4">
                </div>
                <div>
                    <label for="message" class="block text-lg">Mensaje</label>
                    <textarea id="message" name="message" rows="4" class="w-full text-white rounded-lg py-2 px-4"></textarea>
                </div>
                <button type="submit" class="bg-red-600 text-white py-3 px-6 rounded-lg text-lg hover:bg-red-700">Enviar Mensaje</button>
            </form>
        </div>
    </section>
    </main>
    <footer class=" py-4 text-center">
